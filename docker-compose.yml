services:
  lct_middle_backend:
    build:
      context: .
      dockerfile: deployments/Dockerfile
    environment:
      - PYTHONPATH=/app
      - PYTHONBUFFERED=1
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8080:80"
    networks:
      - lct_network

  mongo:
    image: mongo:latest
    restart: always
    ports:
      - "27017:27017"
    networks:
      - lct_network

  redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    networks:
      - lct_network

networks:
  lct_network:
